services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://${POSTGRES_USER:-prueba}:${POSTGRES_PASSWORD:-prueba123}@db:5432/${POSTGRES_DB:-productos_upc}}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el entorno o en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(2200)}).then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })",
        ]
      interval: 3s
      timeout: 3s
      retries: 2
      start_period: 8s
